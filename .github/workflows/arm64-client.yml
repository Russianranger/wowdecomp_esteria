name: Reconstructed client ARM64
on:
  push:
    branches: [android/arm64-port]
  pull_request:
    branches: [Esteria]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm64-client-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cmake -S Tools/PlatformTests -B build/portable -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/portable --parallel 4
      - run: ctest --test-dir build/portable --output-on-failure
      - name: Compile actual optional Retail/Forever source and pinned CascLib
        run: |
          cmake -S Tools/RetailAssets -B build/retail -DCMAKE_BUILD_TYPE=Release
          cmake --build build/retail --target RetailAssetTests --parallel 2
          ctest --test-dir build/retail --output-on-failure -R '^retail-assets'
      - name: Preserve portable offline storage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-retail-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/portable/Testing/Temporary/LastTest.log
            build/retail/Testing/Temporary/LastTest.log
            build/retail/CMakeCache.txt
            build/retail/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
      - run: python3 -m unittest discover -s Tools/RuntimeManifest -v
      - run: python3 -m unittest discover -s Tools/VulkanShaders/tests -v
      - run: python3 -m unittest discover -s Tools/PlatformTests -p 'test_*.py' -v
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            generator: Visual Studio 17 2022
            runtime_dir: bin/Win
          - arch: ARM64
            runner: windows-11-arm
            generator: Visual Studio 18 2026
            runtime_dir: bin/Win/ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure platform behavior tests
        run: cmake -S Tools/PlatformTests -B build/platform -G "${{ matrix.generator }}" -A ${{ matrix.arch }}
      - name: Build platform behavior tests
        run: cmake --build build/platform --config Release --parallel 4
      - name: Run native architecture and Windows differential tests
        run: ctest --test-dir build/platform -C Release --output-on-failure
      - name: Compile and exercise actual optional Retail/Forever source and pinned CascLib
        run: |
          cmake -S Tools/RetailAssets -B build/retail -G "${{ matrix.generator }}" -A ${{ matrix.arch }}
          cmake --build build/retail --config Release --target RetailAssetTests --parallel 2
          ctest --test-dir build/retail -C Release --output-on-failure -R '^retail-assets'
      - name: Configure matched reconstructed client
        id: configure_client
        if: ${{ !cancelled() }}
        run: >-
          cmake -S . -B build/client -G "${{ matrix.generator }}" -A ${{ matrix.arch }}
          -DWOWDECOMP_EXTENDED_LIMITS=ON
          -DWOWDECOMP_CONTAINER_SLOTS=254
          -DWOWDECOMP_QUEST_LOG_SLOTS=25
          -DWOWDECOMP_MAX_CLASSES=32
          -DWOWCLIENT_CRASH_LOG=ON
      - name: Compile complete client
        id: build_client
        if: ${{ !cancelled() && steps.configure_client.outcome == 'success' }}
        run: cmake --build build/client --config RelWithDebInfo --target WowClient --parallel 4 -- /fl /flp:logfile=client-build.log
      - name: Validate binary architecture and record runtime provenance
        id: runtime_manifest
        if: ${{ !cancelled() && steps.build_client.outcome == 'success' }}
        run: >-
          python Tools/RuntimeManifest/generate.py
          --directory "${{ matrix.runtime_dir }}"
          --architecture "${{ matrix.arch }}"
          --revision "${{ github.sha }}"
          --build-id "${{ github.run_id }}.${{ github.run_attempt }}"
          --descriptor-manifest build/client/generated/limits/limits.json
      - name: Exercise packaged movie DLL on the native Windows runner
        if: ${{ !cancelled() && steps.runtime_manifest.outcome == 'success' }}
        run: >-
          & .\build\platform\Release\test_xvid_adapter.exe
          (Resolve-Path "${{ matrix.runtime_dir }}/XvidDecoder.dll").Path
      - name: Build asset-free Vulkan device fixtures
        if: ${{ !cancelled() && steps.runtime_manifest.outcome == 'success' }}
        run: |
          cmake -S Tools/VulkanTests -B build/vulkan -G "${{ matrix.generator }}" -A ${{ matrix.arch }} -DVULKAN_TEXTURE_DEVICE_TEST=ON -DVULKAN_PRESENT_DEVICE_TEST=ON
          cmake --build build/vulkan --config Release --parallel 4
          ctest --test-dir build/vulkan -C Release --output-on-failure -R '^texture_registry$'
      - name: Exercise actual client entry, offline policy, transport and Grunt SRP
        if: ${{ !cancelled() && steps.runtime_manifest.outcome == 'success' }}
        run: >-
          python Tools/PlatformTests/verify_client_auth.py
          --directory "${{ matrix.runtime_dir }}"
          --architecture "${{ matrix.arch }}"
          --output build/client-entry
      - name: Build actual reconstructed FMOD output fixture
        if: ${{ !cancelled() && steps.runtime_manifest.outcome == 'success' }}
        run: |
          cmake -S Tools/AudioTests -B build/audio -G "${{ matrix.generator }}" -A ${{ matrix.arch }}
          cmake --build build/audio --config Release --parallel 4
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            client-build.log
            build/client/client-build.log
            build/client/CMakeCache.txt
            build/client/CMakeFiles/CMakeConfigureLog.yaml
            build/platform/CMakeCache.txt
            build/platform/CMakeFiles/CMakeConfigureLog.yaml
            build/platform/Testing/Temporary/LastTest.log
            build/retail/Testing/Temporary/LastTest.log
            build/retail/CMakeCache.txt
            build/retail/CMakeFiles/CMakeConfigureLog.yaml
            build/platform/Release/test_xvid_adapter.exe
            build/platform/Release/test_local_account.exe
            build/vulkan/Release/texture_device.exe
            build/vulkan/Release/presentation_device.exe
            build/vulkan/CMakeCache.txt
            build/vulkan/CMakeFiles/CMakeConfigureLog.yaml
            build/vulkan/Testing/Temporary/LastTest.log
            build/client-entry/evidence/**
            build/audio/Release/fmod_output_device.exe
            build/audio/CMakeCache.txt
            build/audio/CMakeFiles/CMakeConfigureLog.yaml
            build/client/generated/limits/**
            build/client/Tools/XvidDecoder/Xvid-1.3.7-LICENSE.txt
            ThirdParty/xvidcore/licenses/xvid.txt
            bin/Win/client-build.json
            bin/Win/ARM64/client-build.json
            bin/Win/*.exe
            bin/Win/*.dll
            bin/Win/*.pdb
            bin/Win/ARM64/*.exe
            bin/Win/ARM64/*.dll
            bin/Win/ARM64/*.pdb
  wine-arm64:
    name: Native Linux ARM64 Wine execution
    needs: windows
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout the exact reviewed integration harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Russianranger/esteria_android
          ref: 0146ca89307eb3c00c09b7fbecdf3e301bd9bd53
          path: integration
      - name: Checkout this exact client's committed synthetic auth peer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: client-source
      - name: Download this run's matching native ARM64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-ARM64-${{ github.sha }}
          path: client-artifact
      - name: Record native host and install namespace tools
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iproute2 util-linux binutils
          mkdir -p "$RUNNER_TEMP/wine-host-evidence"
          uname -a > "$RUNNER_TEMP/wine-host-evidence/uname.txt"
          dpkg-query -W iproute2 util-linux python3 binutils > "$RUNNER_TEMP/wine-host-evidence/packages.txt"
          git -C integration rev-parse HEAD > "$RUNNER_TEMP/wine-host-evidence/integration-revision.txt"
      - name: Prepare the exact verified ARM64 Wine candidate
        run: >-
          python3 integration/tools/prepare_runtime.py --download
          --cache "$RUNNER_TEMP/wine-cache"
          --stage "$RUNNER_TEMP/wine-codec-runtime"
      - name: Build source-pinned native guest helpers for captured audio
        run: |
          mkdir -p "$RUNNER_TEMP/guest-bridges"
          docker build --platform linux/arm64 --target guest-export \
            --build-context bridge-src=./integration/native \
            --secret id=build_ca,src=/etc/ssl/certs/ca-certificates.crt \
            --build-arg INTEGRATION_REVISION="$(git -C integration rev-parse HEAD)" \
            --output type=local,dest="$RUNNER_TEMP/guest-bridges/payload" integration/runtime/bridges \
            > "$RUNNER_TEMP/guest-bridges/build.log" 2>&1
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/guest-bridges"
          cp integration/LICENSE "$RUNNER_TEMP/guest-bridges/payload/notices/ESTERIA-GPL-3.0"
          cp integration/runtime/bridge-reference.json "$RUNNER_TEMP/guest-bridges/payload/corresponding-source/"
      - name: Execute client entry/offline/transport/Grunt, codec, graphics and captured FMOD audio
        run: >-
          sudo -n env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory
          GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE/client-source"
          python3 integration/tools/qualify_wine_arm64.py
          --runtime "$RUNNER_TEMP/wine-codec-runtime"
          --client-dir "$GITHUB_WORKSPACE/client-artifact/bin/Win/ARM64"
          --driver "$GITHUB_WORKSPACE/client-artifact/build/platform/Release/test_xvid_adapter.exe"
          --presentation-driver "$GITHUB_WORKSPACE/client-artifact/build/vulkan/Release/presentation_device.exe"
          --texture-driver "$GITHUB_WORKSPACE/client-artifact/build/vulkan/Release/texture_device.exe"
          --client-entry-check
          --client-offline-check
          --client-loopback-check
          --client-auth-source "$GITHUB_WORKSPACE/client-source"
          --require-engine-frame-readback
          --audio-driver "$GITHUB_WORKSPACE/client-artifact/build/audio/Release/fmod_output_device.exe"
          --bridge-dir "$RUNNER_TEMP/guest-bridges/payload"
          --bridge-revision "$(git -C integration rev-parse HEAD)"
          --output "$RUNNER_TEMP/wine-codec-evidence"
      - name: Preserve guest build evidence permissions after success or failure
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/guest-bridges" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/guest-bridges"
          fi
      - name: Preserve execution evidence, including failed startup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-wine-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/wine-host-evidence/
            ${{ runner.temp }}/wine-codec-evidence/
            ${{ runner.temp }}/wine-codec-runtime/package-receipt.json
            ${{ runner.temp }}/guest-bridges/
          retention-days: 14
